# NOTE: Provide required secrets via a .env file or environment variables before deployment:
#   JWT_SECRET=$(openssl rand -hex 32)
#   ADMIN_TOKEN=$(openssl rand -hex 24)
#   POSTGRES_PASSWORD=$(openssl rand -hex 16)
services:
    postgres:
        image: postgres:18-alpine
        container_name: bayesmarket-db
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-bayesuser}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
            POSTGRES_DB: ${POSTGRES_DB:-bayesmarket}
        ports:
            - "127.0.0.1:5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER:-bayesuser} -d ${POSTGRES_DB:-bayesmarket}",
                ]
            interval: 5s
            timeout: 5s
            retries: 5
        restart: unless-stopped

    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
        container_name: bayesmarket-backend
        environment:
            APP_ENV: ${APP_ENV:-production}
            DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-bayesuser}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bayesmarket}?sslmode=disable}
            SERVER_PORT: ${SERVER_PORT:-8080}
            CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4200,http://localhost:80,http://localhost}
            JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (minimum 32 characters)}
            ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN must be set (minimum 16 characters)}
            AUTO_SEED: ${AUTO_SEED:-false}
        ports:
            - "127.0.0.1:8080:8080"
        depends_on:
            postgres:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/healthz || exit 1",
                ]
            interval: 5s
            timeout: 3s
            retries: 5
        restart: unless-stopped

    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
        container_name: bayesmarket-frontend
        ports:
            - "127.0.0.1:4200:80"
        depends_on:
            backend:
                condition: service_healthy
        restart: unless-stopped

volumes:
    pgdata:
